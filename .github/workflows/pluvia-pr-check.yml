name: Pull Request build check

on:
  # Runs on master too: only default-branch runs write Gradle's caches, so this is what gives
  # pull requests a configuration cache and build cache for the test task to start from.
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Only the Modern flavor is built and installed from this fork
        variant: [Modern]
    runs-on: ubuntu-latest
    name: build (${{ matrix.variant }})

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Lets setup-gradle save Gradle's configuration cache (it is only stored encrypted)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Download Gradle (retried; the download servers have outages)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1
      - name: Cache Robolectric SDK jars
        # Robolectric downloads its android-all jars into ~/.m2 at test time, outside Gradle's cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Run unit tests (${{ matrix.variant }})
        timeout-minutes: 45
        run: |
          : > gradle.log
          tail -n +1 -F gradle.log &
          tail_pid=$!
          # Two test JVMs (3 GB each) share the runner's 4 cores / 16 GB: roughly halves the test time
          ./gradlew -PtestForks=2 -PtestHeap=3g :app:test${{ matrix.variant }}DebugUnitTest > gradle.log 2>&1 &
          gradle_pid=$!
          last_size=0
          stalled_for=0
          while kill -0 "$gradle_pid" 2>/dev/null; do
            sleep 15
            size=$(stat -c %s gradle.log)
            if [ "$size" -eq "$last_size" ]; then
              stalled_for=$((stalled_for + 15))
            else
              stalled_for=0
              last_size=$size
            fi
            if [ "$stalled_for" -ge 600 ]; then
              echo "::error::No Gradle output for 10 minutes, dumping test JVM threads"
              for pid in $(pgrep -f 'Gradle Test Executor'); do
                echo "===== jstack $pid ====="
                jstack "$pid" || true
              done
              pkill -f 'Gradle Test Executor' || true
              kill "$gradle_pid" || true
              sleep 2
              kill "$tail_pid" || true
              exit 1
            fi
          done
          wait "$gradle_pid"
          status=$?
          sleep 2
          kill "$tail_pid" || true
          exit $status
