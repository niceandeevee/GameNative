name: Compile check

# Fast feedback for refactors on working branches: compiles the Modern debug app and its unit
# tests (no test run, no APK). The PR check runs the tests.
on:
  push:
    branches-ignore: [ "master" ]
    paths-ignore:
      - '**.md'

# One group per commit and never cancel: every pushed commit gets a full compile result.
concurrency:
  group: compile-check-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile app and unit tests (Modern debug)
        run: ./gradlew --continue :app:compileModernDebugUnitTestKotlin :app:compileModernDebugUnitTestJavaWithJavac
